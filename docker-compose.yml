services:
  gym-core:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GYM_DATA_DIR: /app/data
      GYM_DB_PATH: /app/data/gym_coach.db
      WECHAT_INBOX_DIR: /app/data/inbox
      WECHAT_ALLOWED_INBOX_ROOTS: /app/data/inbox
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
