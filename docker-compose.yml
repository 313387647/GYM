services:
  gym-core:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GYM_DATA_DIR: /app/data
      GYM_DB_PATH: /app/data/gym_coach.db
      WECHAT_INBOX_DIR: /app/data/inbox
      WECHAT_ALLOWED_INBOX_ROOTS: /app/data/inbox
      WECHAT_INJECT_ENABLED: "false"
      GYM_MIGRATE_ON_START: "true"
    volumes:
      - gym-data:/app/data
      - ./config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  wechat-bridge:
    build:
      context: .
      dockerfile: Dockerfile.wechat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WECHAT_ACP_INSTANCE: gym
      WECHAT_INJECT_ENABLED: "true"
      GYM_MIGRATE_ON_START: "false"
    depends_on:
      gym-core:
        condition: service_healthy
    volumes:
      - gym-data:/app/data
      - wechat-state:/wechat-state
      - ./config.json:/app/config.json:ro
    command: ["wechat-acp", "--instance", "gym", "--agent", "node src/acp/server.mjs", "--cwd", "/app", "--inbox-dir", "/app/data/inbox", "--hide-thoughts"]
  wechat-delivery-worker:
    build:
      context: .
      dockerfile: Dockerfile.wechat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WECHAT_ACP_INSTANCE: gym
      WECHAT_INJECT_ENABLED: "true"
      GYM_MIGRATE_ON_START: "false"
    depends_on:
      gym-core:
        condition: service_healthy
    volumes:
      - gym-data:/app/data
      - wechat-state:/wechat-state
      - ./config.json:/app/config.json:ro
    command: ["node", "src/integrations/wechat/outboundWorker.js"]
volumes:
  gym-data:
  wechat-state:
